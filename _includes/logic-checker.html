<iframe id="logic-checker" src="{{ '/tools/core-logic/' | relative_url }}" title="{% if page.url contains '/ko/' %}논리 검산기{% else %}Logic Proof Checker{% endif %}" style="display:block;width:100%;min-height:900px;border:0;margin-top:24px;"></iframe>
<script>
(function () {
  var frame = document.getElementById('logic-checker');
  frame.addEventListener('load', function () {
    var body = frame.contentDocument.body;
    var resize = function () { frame.style.height = Math.ceil(body.getBoundingClientRect().height + 20) + 'px'; };
    resize();
    new ResizeObserver(resize).observe(body);
  });
})();
</script>
