description: |
  蓋將自其變者而觀之﹐而天地曾不能一瞬;  
  自其不變者而觀之﹐則物于我皆無盡也。  
  When viewed from a changing perspective, the universe can hardly be the same even within a blink of an eye,  
  But when looked at from an unchanging perspective, everything conserves itself, and so do we.  


  우인진
  
  Administrative Assistant, Institute for Philosophy and Liberal Arts Education, Sungkyunkwan University.  
  Research Assistant, The Academy of Mobility Humanities, Konkuk University.  



