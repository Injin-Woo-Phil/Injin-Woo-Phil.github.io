description: |
  蓋將自其變者而觀之，而天地曾不能以一瞬；自其不變者而觀之，則物與我皆無盡也。
  When viewed from a changing perspective, the universe can hardly be the same even within a blink of an eye; but when looked at from an unchanging perspective, everything conserves itself, and so do we.

