name: Build CV PDF

# Rebuild the downloadable CV PDFs whenever the CV markdown changes.
# Inspired by https://github.com/junian/markdown-resume (pandoc -> PDF).
on:
  push:
    branches: [master]
    paths:
      - cv.md
      - ko/cv.md
      - .github/workflows/cv-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc + XeLaTeX + Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-lang-cjk texlive-fonts-recommended fonts-noto-cjk

      - name: Build PDFs
        run: |
          set -e
          DATE="$(date -u +%Y-%m-%d)"
          mkdir -p assets

          build() {
            src="$1"; out="$2"; title="$3"
            # Drop the Jekyll front matter (first --- ... --- block) and the
            # on-page download link, then render with XeLaTeX for Korean glyphs.
            awk 'c==2; /^---$/ {c++}' "$src" | grep -v '/assets/cv' > /tmp/body.md
            pandoc /tmp/body.md -o "$out" \
              --pdf-engine=xelatex \
              -V mainfont="Noto Serif CJK KR" \
              -V CJKmainfont="Noto Serif CJK KR" \
              -V geometry:margin=2.2cm \
              -V colorlinks=true \
              -V title="$title" \
              -V author="Injin Woo" \
              -V date="Updated: ${DATE}"
          }

          build cv.md    assets/cv.pdf    "Curriculum Vitae"
          build ko/cv.md assets/cv-ko.pdf "이력서"

      - name: Commit PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv.pdf assets/cv-ko.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build CV PDF ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi
