name: Build CV PDF

# Rebuild the downloadable CV PDFs from the single data source (_data/cv.yml).
# bin/build_cv.rb renders cv.tex / cv-ko.tex, XeLaTeX compiles them.
on:
  push:
    branches: [master]
    paths:
      - _data/cv.yml
      - bin/build_cv.rb
      - bin/cv_preamble.tex
      - .github/workflows/cv-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX + fonts
        run: |
          sudo apt-get update
          # texlive-fonts-recommended provides TeX Gyre Termes;
          # Noto Serif CJK is in fonts-noto-cjk-extra (base package is Sans only).
          sudo apt-get install -y \
            texlive-xetex texlive-lang-cjk texlive-fonts-recommended \
            fonts-noto-cjk fonts-noto-cjk-extra
          sudo fc-cache -f

      - name: Generate .tex from _data/cv.yml
        run: ruby bin/build_cv.rb .

      - name: Compile PDFs
        run: |
          set -e
          mkdir -p assets
          xelatex -interaction=nonstopmode -halt-on-error cv.tex
          xelatex -interaction=nonstopmode -halt-on-error cv-ko.tex
          mv cv.pdf assets/cv.pdf
          mv cv-ko.pdf assets/cv-ko.pdf

      - name: Commit PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cv.pdf assets/cv-ko.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build CV PDF ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi
